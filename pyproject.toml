[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lastbell"
version = "0.1.0"
description = "Self-hosted ParentVUE grade & assignment monitor — alerts for any number of watchers, and the students too."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Last Bell contributors" }]
keywords = ["parentvue", "edupoint", "synergy", "grades", "school", "self-hosted"]
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "keyring>=24.0",
]

[project.optional-dependencies]
service = ["APScheduler>=3.10"]
dev = ["pytest>=7.4"]

[project.scripts]
lastbell = "lastbell.cli:main"
# The preflight doubles as a standalone district-compatibility tool:
#   pipx run --spec lastbell parentvue-preflight -d some-host.edupoint.com
parentvue-preflight = "lastbell.preflight:main"

[tool.setuptools.packages.find]
include = ["lastbell*"]

[tool.setuptools.package-data]
lastbell = ["schema.sql", "style.css", "app.js", "mcps_schools.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
