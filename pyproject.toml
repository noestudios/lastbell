[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpsgradewatch"
version = "0.1.0"
description = "Self-hosted ParentVUE grade & assignment monitor — alerts for any number of watchers, and the students too."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "mcpsgradewatch contributors" }]
keywords = ["parentvue", "edupoint", "synergy", "grades", "school", "self-hosted"]
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "keyring>=24.0",
]

[project.optional-dependencies]
service = ["APScheduler>=3.10"]
dev = ["pytest>=7.4"]

[project.scripts]
mcpsgradewatch = "mcpsgradewatch.cli:main"

[tool.setuptools.packages.find]
include = ["mcpsgradewatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
