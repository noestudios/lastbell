name: release

# Tag-driven release to PyPI via trusted publishing (OIDC) — no long-lived
# token lives in this repo. One-time setup on pypi.org (after the manual
# first upload claims the name): project "lastbell" → Settings → Publishing →
# add this repo/workflow ("release.yml", environment "pypi").
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - name: absolute image URLs for the PyPI long description
        # The README keeps relative paths (what GitHub renders, private or
        # public); pypi.org can only show images by absolute URL.
        run: sed -i 's#assets/screenshots/#https://raw.githubusercontent.com/noestudios/lastbell/main/assets/screenshots/#g' README.md
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # the trusted-publishing credential
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
